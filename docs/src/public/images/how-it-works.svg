<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="268" viewBox="0 0 720 268" role="img" aria-label="Saving an entry clears the 3 pages that show it; the next request is served as a static file">
<style>
