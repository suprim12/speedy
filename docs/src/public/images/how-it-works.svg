.w{fill:#e6e8ef}.d{fill:#9aa1b2}.c{fill:#6b7285}.y{fill:#ffd43b;font-weight:600}.g{fill:#6ee7a0}
.l{opacity:0}
@keyframes k0{0%,4%{opacity:0;transform:translateY(4px)}6%,92%{opacity:1;transform:none}97%,100%{opacity:0}}.l0{animation:k0 10s ease-out infinite}@keyframes k1{0%,14%{opacity:0;transform:translateY(4px)}16%,92%{opacity:1;transform:none}97%,100%{opacity:0}}.l1{animation:k1 10s ease-out infinite}@keyframes k2{0%,24%{opacity:0;transform:translateY(4px)}26%,92%{opacity:1;transform:none}97%,100%{opacity:0}}.l2{animation:k2 10s ease-out infinite}@keyframes k3{0%,40%{opacity:0;transform:translateY(4px)}42%,92%{opacity:1;transform:none}97%,100%{opacity:0}}.l3{animation:k3 10s ease-out infinite}@keyframes k4{0%,52%{opacity:0;transform:translateY(4px)}54%,92%{opacity:1;transform:none}97%,100%{opacity:0}}.l4{animation:k4 10s ease-out infinite}@keyframes k5{0%,60%{opacity:0;transform:translateY(4px)}62%,92%{opacity:1;transform:none}97%,100%{opacity:0}}.l5{animation:k5 10s ease-out infinite}
@media (prefers-reduced-motion:reduce){.l{animation:none;opacity:1}}
</style>
<rect width="720" height="268" rx="14" fill="#14161f"/>
<rect x=".5" y=".5" width="719" height="267" rx="13.5" fill="none" stroke="#2a2e3b"/>
<circle cx="28" cy="28" r="6" fill="#3a3f4f"/><circle cx="48" cy="28" r="6" fill="#3a3f4f"/><circle cx="68" cy="28" r="6" fill="#3a3f4f"/>
<path d="M690 17.5 682 28h5l-1.3 7.5L694 25h-5l1-7.5z" fill="#ffd43b"/>
<line x1="0" y1="50" x2="720" y2="50" stroke="#2a2e3b"/>
<line x1="36" y1="152" x2="684" y2="152" stroke="#232734" stroke-dasharray="3 5"/>
<text class="l l0" x="36" y="78" xml:space="preserve"><tspan class="c"># An editor saves “Summer Sale”</tspan></text>
<text class="l l1" x="36" y="106" xml:space="preserve"><tspan class="w">Saved entry “Summer Sale”</tspan><tspan class="y">  →  3 pages</tspan></text>
<text class="l l2" x="36" y="132" xml:space="preserve"><tspan class="d">/sale    /news    /</tspan><tspan class="c">    rebuilt in the background</tspan></text>
<text class="l l3" x="36" y="176" xml:space="preserve"><tspan class="g">$ </tspan><tspan class="w">curl -I https://example.com/sale</tspan></text>
<text class="l l4" x="36" y="204" xml:space="preserve"><tspan class="d">HTTP/2 200</tspan></text>
<text class="l l5" x="36" y="230" xml:space="preserve"><tspan class="d">x-speedy: </tspan><tspan class="y">STATIC</tspan><tspan class="c">    sent by the web server, no PHP</tspan></text>
